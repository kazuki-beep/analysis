<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Bono</title>
<meta name="description" content="Ingresa a la plataforma de descarbonización de Bono.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#08100D">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/bono.css">
</head>
<body>

<a class="skip-link" href="#main">Ir al contenido</a>

<main id="main" class="section" style="min-height:100vh;display:grid;place-items:center">
  <div class="wrap" style="max-width:420px">

    <a class="logo" href="./" style="justify-content:center" aria-label="Bono — inicio">
      <svg class="logo__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="22" height="22" rx="6" fill="#08100D"/>
        <path d="M6 16.5C8.6 16.5 9.6 7.5 13 7.5c2 0 3 2.4 5 2.4" stroke="#C8F751" stroke-width="1.9" stroke-linecap="round"/>
        <circle cx="18" cy="9.9" r="2" fill="#12A97C"/>
      </svg>
      <span>Bono</span>
    </a>

    <div class="card" style="margin-top:2rem;padding:clamp(1.5rem,4vw,2.25rem)">
      <h1 class="h3">Ingresar</h1>
      <p class="body-muted" style="margin-top:.5rem;font-size:.9375rem">Accede a tu plataforma de descarbonización.</p>

      <form style="display:grid;gap:1.1rem;margin-top:1.75rem" onsubmit="return false">
        <div class="field">
          <label for="s-email">Correo corporativo</label>
          <input class="control" id="s-email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="s-password">Contraseña</label>
          <input class="control" id="s-password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
      </form>

      <div style="display:flex;align-items:center;gap:1rem;margin-block:1.5rem">
        <span class="rule" style="flex:1"></span>
        <span class="mono" style="font-size:.6875rem;color:var(--ink-faint);letter-spacing:.1em">O</span>
        <span class="rule" style="flex:1"></span>
      </div>

      <button class="btn btn--ghost btn--block" type="button">Continuar con SSO</button>

      <p class="demo-note" style="margin-top:1.75rem">
        <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.2"/><path d="M7 6.2v4M7 4.1v.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Esta pantalla no está conectada a un proveedor de identidad. Apúntala a la
        autenticación real de la plataforma de Bono antes de publicar — ver README.md.
      </p>
    </div>

    <p style="text-align:center;margin-top:1.5rem;font-size:.9375rem;color:var(--ink-muted)">
      ¿No tienes cuenta? <a class="link-arrow" href="demo.html">Solicitar demo</a>
    </p>
    <p style="text-align:center;margin-top:1rem">
      <a class="nav__login" href="../signin.html" lang="en">English</a>
    </p>

  </div>
</main>

<script src="../assets/js/bono.js" defer></script>
</body>
</html>
